<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        /* NAVBAR */
        .navbar {
            background: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: space-around;
            background: #2ecc71;
            color: white;
        }

        .tab {
            padding: 10px;
            cursor: pointer;
        }

        .tab.active {
            background: #27ae60;
        }

        /* CONTENT */
        .content {
            padding: 20px;
        }

        /* CARD */
        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        /* BUTTON */
        .btn {
            padding: 10px;
            background: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        /* FLOAT BUTTON */
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            border: none;
            font-size: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="navbar">Splitwise Dashboard</div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('groups')">Groups</div>
        <div class="tab" onclick="switchTab('friends')">Friends</div>
        <div class="tab" onclick="switchTab('activity')">Activity</div>
        <div class="tab" onclick="switchTab('profile')">Profile</div>
    </div>

    <div class="content" id="content"></div>

    <button class="floating-btn" onclick="addExpense()">+</button>

    <script>

        const API = "http://localhost:3000";
        const token = localStorage.getItem("token");

        // 🔐 redirect if not logged in
        if (!token) {
            window.location.href = "login.html";
        }

        // switch tabs
        function switchTab(tab) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            event.target.classList.add("active");

            if (tab === "groups") loadGroups();
            if (tab === "friends") loadFriends();
            if (tab === "activity") loadActivity();
            if (tab === "profile") loadProfile();

            // hide add button in profile
            document.querySelector(".floating-btn").style.display =
                (tab === "profile") ? "none" : "block";
        }

        // 🟣 GROUPS
        async function loadGroups() {

            const res = await fetch(`${API}/groups/user`, {
                headers: {
                    "Authorization": token
                }
            });

            if (!res.ok) {
                document.getElementById("content").innerHTML = "Failed to load groups";
                return;
            }

            const data = await res.json();

            let html = `<h2>Your Groups</h2>
                <button class="btn" onclick="createGroup()">+ Create Group</button>`;

            if (!data.groups || data.groups.length === 0) {
                html += `<p>No groups found</p>`;
            } else {
                data.groups.forEach(g => {
                    html += `<div class="card">${g.group_name}</div>`;
                });
            }

            document.getElementById("content").innerHTML = html;
        }

        // 🟢 FRIENDS (balances)
        async function loadFriends() {

            const res = await fetch(`${API}/balances`, {
                headers: {
                    "Authorization": token
                }
            });

            if (!res.ok) {
                document.getElementById("content").innerHTML = "Failed to load balances";
                return;
            }

            const data = await res.json();

            let html = `<h2>Balances</h2>`;

            if (!data.breakdown || data.breakdown.length === 0) {
                html += `<p>No balances</p>`;
            } else {
                data.breakdown.forEach(b => {
                    html += `<div class="card">
                        ${b.user} :
                        ${b.you_owe ? "You owe ₹" + b.you_owe : "You get ₹" + b.you_get}
                     </div>`;
                });
            }

            document.getElementById("content").innerHTML = html;
        }

        // 🔵 ACTIVITY
        async function loadActivity() {

            const res = await fetch(`${API}/settlements`, {
                headers: {
                    "Authorization": token
                }
            });

            if (!res.ok) {
                document.getElementById("content").innerHTML = "Failed to load activity";
                return;
            }

            const data = await res.json();

            let html = `<h2>Activity</h2>`;

            if (!data.settlements || data.settlements.length === 0) {
                html += `<p>No activity</p>`;
            } else {
                data.settlements.forEach(s => {
                    html += `<div class="card">
                        ${s.from_user_name} → ${s.to_user_name} : ₹${s.amount}
                     </div>`;
                });
            }

            document.getElementById("content").innerHTML = html;
        }

        // ⚫ PROFILE
        async function loadProfile() {
            const res = await fetch(`${API}/profile`, {
                headers: {
                    "Authorization": token
                }
            });

            const user = await res.json();

            let html = `
        <h2>Profile</h2>
        <div class="card">Name: ${user.user_name}</div>
        <div class="card">Email: ${user.email}</div>

        <button class="btn" onclick="logout()">Logout</button>
    `;

            document.getElementById("content").innerHTML = html;
        }

        // ➕ Create Group
        async function createGroup() {
            const name = prompt("Enter group name");

            if (!name) return;

            await fetch(`${API}/groups`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: token
                },
                body: JSON.stringify({ group_name: name })
            });

            loadGroups();
        }

        // ➕ Add Expense
        function addExpense() {
            alert("Add expense feature coming next");
        }

        // 🔓 Logout
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }

        // load default
        loadGroups();

    </script>

</body>

</html>
