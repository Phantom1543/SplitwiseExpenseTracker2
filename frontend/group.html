<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Group Details</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

.header {
    background: #2ecc71;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.section {
    padding: 15px;
}

.card {
    background: white;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
}

.btn {
    padding: 10px;
    margin: 5px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.input {
    padding: 8px;
    width: 100%;
    margin: 5px 0;
}
</style>
</head>

<body>

<div class="header" id="groupName">Group</div>

<div class="section">
    <h3>Members</h3>
    <div id="members"></div>

    <input type="text" id="phoneInput" class="input" placeholder="Enter phone number">
    <button class="btn" onclick="addMember()">Add Member</button>
</div>

<div class="section">
    <h3>Expenses</h3>
    <div id="expenses"></div>
</div>

<div class="section">
    <h3>Add Expense</h3>

    <input type="number" id="amount" class="input" placeholder="Amount">
    <input type="text" id="description" class="input" placeholder="Description">

    <label>Split Type:</label>
    <select id="splitType" class="input">
        <option value="equal">Equal</option>
        <option value="custom">Custom</option>
    </select>

    <div id="memberCheckboxes"></div>

    <button class="btn" onclick="addExpense()">Add Expense</button>
</div>

<script>

const API = "http://localhost:3000";
const token = localStorage.getItem("token");

// 🔐 redirect if not logged in
if (!token) {
    window.location.href = "login.html";
}

// get group id from URL
const params = new URLSearchParams(window.location.search);
const groupId = params.get("group_id");

// load everything
loadGroup();
loadMembers();
loadExpenses();


// 🟣 Load Group Info
async function loadGroup() {
    const res = await fetch(`${API}/groups/${groupId}`, {
        headers: { "Authorization": token }
    });

    if (!res.ok) return;

    const data = await res.json();

    document.getElementById("groupName").innerText = data.group.group_name;
}


// 🟢 Load Members
async function loadMembers() {
    const res = await fetch(`${API}/groups/${groupId}/members`, {
        headers: { "Authorization": token }
    });

    const data = await res.json();

    let html = "";
    let checkboxes = "";

    data.members.forEach(m => {
        html += `<div class="card">${m.user_name} (${m.group_role})</div>`;

        checkboxes += `
            <label>
                <input type="checkbox" value="${m.user_id}">
                ${m.user_name}
            </label><br>
        `;
    });

    document.getElementById("members").innerHTML = html;
    document.getElementById("memberCheckboxes").innerHTML = checkboxes;
}


// 🔵 Load Expenses
async function loadExpenses() {
    const res = await fetch(`${API}/groups/${groupId}/expenses`, {
        headers: { "Authorization": token }
    });

    const data = await res.json();

    let html = "";

    data.expenses.forEach(e => {
        html += `
            <div class="card">
                ${e.exp_description} - ₹${e.amount}<br>
                Paid by: ${e.paid_by_name}
            </div>
        `;
    });

    document.getElementById("expenses").innerHTML = html;
}


// ➕ Add Member
async function addMember() {
    const phone = document.getElementById("phoneInput").value;

    if (!phone) return alert("Enter phone number");

    const res = await fetch(`${API}/groups/add-member`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": token
        },
        body: JSON.stringify({
            group_id: groupId,
            phone_no: phone
        })
    });

    const data = await res.json();
    alert(data.message);

    loadMembers();
}


// ➕ Add Expense
async function addExpense() {

    const amount = document.getElementById("amount").value;
    const description = document.getElementById("description").value;
    const splitType = document.getElementById("splitType").value;

    const checked = document.querySelectorAll("#memberCheckboxes input:checked");

    if (!amount || checked.length === 0) {
        return alert("Fill all fields");
    }

    let members = [];

    if (splitType === "equal") {
        checked.forEach(c => {
            members.push({ user_id: Number(c.value) });
        });
    } else {
        checked.forEach(c => {
            const amt = prompt(`Enter amount for user ${c.value}`);
            members.push({
                user_id: Number(c.value),
                amount_owed: Number(amt)
            });
        });
    }

    const res = await fetch(`${API}/expenses`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": token
        },
        body: JSON.stringify({
            group_id: groupId,
            amount: Number(amount),
            exp_description: description,
            split_type: splitType,
            members: members
        })
    });

    const data = await res.json();
    alert(data.message);

    loadExpenses();
}

</script>

</body>
</html>
