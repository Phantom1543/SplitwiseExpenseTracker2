<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Group Details</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .header {
            background: #2ecc71;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .section {
            padding: 15px;
        }

        .card {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .btn {
            padding: 10px;
            margin: 5px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .input {
            padding: 8px;
            width: 100%;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <div class="header" style="display:flex; justify-content:space-between; align-items:center;">

        <div id="groupName">Group</div>

        <div id="groupActions"></div>

    </div>

    <div class="section">
        <h3>Members</h3>
        <div id="members"></div>

        <div id="adminSelectBox" style="display:none;">
            <label>Select new admin:</label>
            <select id="newAdminSelect" class="input"></select>

            <!-- ✅ NEW BUTTON -->
            <button onclick="changeAdmin()" class="btn" style="margin-top:5px;">
                Change Admin
            </button>
        </div>

        <div id="addMemberBox" style="display:none;">
            <input type="text" id="memberPhoneInput" placeholder="Add member phone" class="input">
            <button class="btn" onclick="addMember()">Add</button>
        </div>

        <button id="addMemberBtn" class="btn" onclick="showAddMemberBox()">Add Member</button>
    </div>

    <!-- ✅ NEW SECTION ADDED HERE -->
    <div class="section">
        <h3>Balances</h3>
        <div id="balances"></div>
    </div>

    <div class="section">
        <h3>Expenses</h3>
        <div id="expenses"></div>
    </div>

    <div class="section">
        <h3>Add Expense</h3>

        <input type="number" id="amount" class="input" placeholder="Amount">
        <input type="text" id="description" class="input" placeholder="Description">

        <label>Split Type:</label>
        <select id="splitType" class="input" onchange="handleSplitType()">
            <option value="equal">Equal</option>
            <option value="custom">Custom</option>
        </select>

        <div id="memberCheckboxes"></div>
        <div id="customAmounts"></div>

        <button class="btn" onclick="addExpense()">Add Expense</button>
    </div>

    <script>
        let memberList = [];

        const API = "http://localhost:3000";
        const token = localStorage.getItem("token");

        // 🔐 redirect if not logged in
        if (!token) {
            window.location.href = "login.html";
        }

        // get group id from URL
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get("group_id");
        let memberMap = {};

        // load everything
        loadGroup();
        loadMembers();
        loadBalances();
        loadExpenses();


        // 🟣 Load Group Info
        async function loadGroup() {
            const res = await fetch(`${API}/groups/${groupId}`, {
                headers: { "Authorization": token }
            });

            if (!res.ok) return;

            const data = await res.json();

            const currentUserId = JSON.parse(atob(token.split('.')[1])).user_id;

            const isAdmin = data.members.some(m =>
                m.user_id === currentUserId && m.group_role === "Admin"
            );

            // ✅ ALWAYS KEEP DROPDOWN HIDDEN INITIALLY
            document.getElementById("adminSelectBox").style.display = "none";

            // ✅ group name
            document.getElementById("groupName").innerText = data.group.group_name;

            // ✅ buttons
            document.getElementById("groupActions").innerHTML = `
                ${isAdmin
                    ? `<button onclick="showAdminDropdown()" class="btn">Change Admin</button>`
                    : ""}

                <button onclick="leaveGroup()" class="btn">Leave</button>
            `;
        }
        // 🟢 Load Members
        async function loadMembers() {
            const res = await fetch(`${API}/groups/${groupId}/members`, {
                headers: { "Authorization": token }
            });

            const data = await res.json();
            memberList = data.members;

            // ✅ fill dropdown
            let options = '<option value="">Select member</option>';

            data.members.forEach(m => {
                if (m.group_role !== "Admin") {
                    options += `<option value="${m.user_id}">${m.user_name}</option>`;
                }
            });

            document.getElementById("newAdminSelect").innerHTML = options;

            // ✅ reset + build member map
            memberMap = {};
            data.members.forEach(m => {
                memberMap[m.user_name] = m.user_id;
            });

            let html = "";
            let checkboxes = "";

            // ✅ get current user id
            const currentUserId = JSON.parse(atob(token.split('.')[1])).user_id;

            // ✅ check admin
            const isAdmin = data.members.some(m =>
                m.user_id === currentUserId && m.group_role === "Admin"
            );

            data.members.forEach(m => {

                html += `<div class="card">
            ${m.user_name} (${m.group_role})

            ${isAdmin && m.group_role !== "Admin"
                        ? `<button onclick="removeMember(${m.user_id})">Remove</button>`
                        : ""
                    }
        </div>`;

                checkboxes += `
            <label>
                <input type="checkbox" value="${m.user_id}" onchange="handleSplitType()">
                ${m.user_name}
            </label><br>
        `;
            });

            document.getElementById("members").innerHTML = html;
            document.getElementById("memberCheckboxes").innerHTML = checkboxes;
        }

        async function loadBalances() {
            const res = await fetch(`${API}/groups/${groupId}/balances`, {
                headers: { "Authorization": token }
            });

            const data = await res.json();

            let html = "";

            const currentUserId = JSON.parse(atob(token.split('.')[1])).user_id;

            if (!data.settlements || data.settlements.length === 0) {
                html = "<p>No balances</p>";
            } else {

                data.settlements.forEach(s => {

                    const isDebtor = currentUserId === s.from_id;
                    const isCreditor = currentUserId === s.to_id;

                    if (isDebtor) {
                        // 👉 YOU OWE
                        html += `
                    <div class="card">
                        You owe ${s.to} ₹${s.amount}
                        <button onclick="settle(${s.from_id}, ${s.to_id}, ${s.amount})">
                            Pay
                        </button>
                    </div>
                `;
                    }
                    else if (isCreditor) {
                        // 👉 YOU GET
                        html += `
                    <div class="card">
                        You get ₹${s.amount} from ${s.from}
                    </div>
                `;
                    }
                });
            }

            document.getElementById("balances").innerHTML = html;
        }

        // 🔵 Load Expenses
        async function loadExpenses() {
            const res = await fetch(`${API}/groups/${groupId}/expenses`, {
                headers: { "Authorization": token }
            });

            const data = await res.json();

            let html = "";

            data.expenses.forEach(e => {
                html += `
            <div class="card">
                ${e.exp_description} - ₹${e.amount}<br>
                Paid by: ${e.paid_by_name}
            </div>
        `;
            });

            document.getElementById("expenses").innerHTML = html;
        }


        // ➕ Add Member
        async function addMember() {
            const phone = document.getElementById("memberPhoneInput").value;

            if (!phone) return alert("Enter phone number");

            const res = await fetch(`${API}/groups/add-member`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    group_id: groupId,
                    phone_no: phone
                })
            });

            const data = await res.json();
            alert(data.message);

            loadMembers();

            // ✅ ADD THESE 2 LINES
            document.getElementById("memberPhoneInput").value = "";
            document.getElementById("addMemberBox").style.display = "none";
            document.getElementById("addMemberBtn").style.display = "block";
        }


        // ➕ Add Expense
        async function addExpense() {

            const amount = document.getElementById("amount").value;
            const description = document.getElementById("description").value;
            const splitType = document.getElementById("splitType").value;

            const checked = document.querySelectorAll("#memberCheckboxes input:checked");

            if (!amount || checked.length === 0) {
                return alert("Fill all fields");
            }

            let members = [];

            // ✅ EQUAL SPLIT
            if (splitType === "equal") {

                checked.forEach(c => {
                    members.push({ user_id: Number(c.value) });
                });

            }
            // ✅ CUSTOM SPLIT (UPDATED)
            else {

                const inputs = document.querySelectorAll("#customAmounts input");

                inputs.forEach(input => {
                    members.push({
                        user_id: Number(input.dataset.user),
                        amount_owed: Number(input.value || 0)
                    });
                });

                // ✅ VALIDATION
                const total = members.reduce((sum, m) => sum + m.amount_owed, 0);

                if (total !== Number(amount)) {
                    return alert("Split must match total amount");
                }
            }

            // ✅ API CALL (same as before)
            const res = await fetch(`${API}/expenses`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    group_id: groupId,
                    amount: Number(amount),
                    exp_description: description,
                    split_type: splitType,
                    members
                })
            });

            const data = await res.json();
            alert(data.message);

            loadExpenses();
            loadBalances();
        }

        function showAddMemberBox() {
            document.getElementById("addMemberBox").style.display = "block";

            // ✅ hide button
            document.getElementById("addMemberBtn").style.display = "none";
        }

        async function removeMember(userId) {
            const confirmRemove = confirm("Remove this member?");
            if (!confirmRemove) return;

            const res = await fetch(`${API}/groups/remove-member`, {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    group_id: groupId,
                    user_id: userId
                })
            });

            const data = await res.json();
            alert(data.message);

            await loadMembers();
            await loadBalances();
        }

        async function settle(fromUser, toUser, amount) {

            const confirmSettle = confirm(`Settle ₹${amount}?`);
            if (!confirmSettle) return;

            const res = await fetch(`${API}/settlements`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    from_user: fromUser,
                    to_user: toUser,
                    amount: amount,
                    group_id: groupId   // ✅ now correct
                })
            });

            const data = await res.json();
            alert(data.message);

            await loadMembers();
            await loadBalances();
        }

        function getUserIdByName(name) {
            return memberMap[name];
        }

        function handleSplitType() {

            const type = document.getElementById("splitType").value;

            if (type === "custom") {
                renderCustomInputs();
            } else {
                document.getElementById("customAmounts").innerHTML = "";
            }
        }

        function renderCustomInputs() {

            const checkboxes = document.querySelectorAll("#memberCheckboxes input:checked");

            let html = "";

            checkboxes.forEach(cb => {
                const userId = cb.value;
                const name = cb.parentElement.textContent.trim();

                html += `
                    <div>
                        ${name}
                        <input type="number" placeholder="Amount" 
                               class="input" data-user="${userId}">
                    </div>
                `;
            });

            document.getElementById("customAmounts").innerHTML = html;
        }

        async function deleteGroup(groupId) {

            const confirmDelete = confirm("Delete this group?");
            if (!confirmDelete) return;

            const res = await fetch(`${API}/groups/${groupId}`, {
                method: "DELETE",
                headers: {
                    "Authorization": token
                }
            });

            const data = await res.json();
            alert(data.message);

            // ✅ REDIRECT + FORCE REFRESH
            window.location.replace("dashboard.html");
        }

        async function leaveGroup() {

            const confirmLeave = confirm("Are you sure you want to leave this group?");
            if (!confirmLeave) return;

            const currentUserId = JSON.parse(atob(token.split('.')[1])).user_id;

            const isAdmin = memberList.some(m =>
                m.user_id === currentUserId && m.group_role === "Admin"
            );

            if (isAdmin) {

                if (memberList.length === 1) {

                    const confirmDelete = confirm(
                        "You are the only member. Leaving will permanently delete this group. Continue?"
                    );

                    if (!confirmDelete) return;

                } else {
                    return alert("Transfer admin role before leaving");
                }
            }

            const res = await fetch(`${API}/groups/leave`, {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    group_id: groupId
                })
            });

            const data = await res.json();
            alert(data.message);

            if (
                data.message.includes("left") ||
                data.message.includes("deleted")
            ) {
                window.location.replace("dashboard.html");
            }
        }

        async function changeAdmin() {

            const newAdminId = document.getElementById("newAdminSelect").value;

            if (!newAdminId) {
                return alert("Please select a member");
            }

            const res = await fetch(`${API}/groups/change-admin`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    group_id: groupId,
                    new_admin_id: newAdminId
                })
            });

            const data = await res.json();
            alert(data.message);

            // refresh members to show new admin
            loadMembers();
        }

        function showAdminDropdown() {
            const box = document.getElementById("adminSelectBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }

        async function confirmAdminChange() {

            const newAdminId = document.getElementById("newAdminSelect").value;

            if (!newAdminId) {
                return alert("Please select a member");
            }

            const res = await fetch(`${API}/groups/change-admin`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": token
                },
                body: JSON.stringify({
                    group_id: groupId,
                    new_admin_id: newAdminId
                })
            });

            const data = await res.json();
            alert(data.message);

            // ✅ FIX: hide BEFORE reload
            document.getElementById("adminSelectBox").style.display = "none";
            document.getElementById("newAdminSelect").value = "";

            await loadMembers();
            await loadGroup();
        }

    </script>

</body>

</html>
